<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DICA REMATES">
<title>DICA REMATES</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --vino:#4a1220;--vino2:#2a0c13;--oro:#d4af6a;--oro2:#f3dfae;
  --cal:#fbf8f3;--cal2:#cdbcaf;--linea:rgba(212,175,106,.2);
  --panel:rgba(14,5,9,.62);--panelV:rgba(74,18,32,.74);--rojo:#f2a7a7;--verde:#7ee0a1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{color:var(--cal);font-family:'Archivo',system-ui,sans-serif;font-size:15px;background:#060205;-webkit-tap-highlight-color:transparent}
body.protegido{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
.vidrio{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.oro{color:var(--oro)}

/* Fondo: estadio nocturno */
#fondo{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(130% 55% at 50% 72%,#4a1220 0%,#1c070d 48%,#060205 100%)}
#fondo svg{position:absolute;inset:0;width:100%;height:100%}
#fondo .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,2,5,.25) 0%,rgba(6,2,5,.5) 50%,rgba(6,2,5,.82) 100%)}
.hazA,.hazB{transform-box:view-box}
.hazA{transform-origin:30px 222px;animation:hazA 6s ease-in-out infinite alternate}
.hazB{transform-origin:360px 222px;animation:hazB 7s ease-in-out infinite alternate}
.gradas{animation:gradas 3s linear infinite}
.foco{animation:foco 2.4s ease-in-out infinite}
#app{position:relative;z-index:1}

/* Encabezado y navegación */
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(20,7,11,.72);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
.top{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca{font-family:'Jost',sans-serif;font-weight:500;font-size:20px;letter-spacing:1px;line-height:1;display:flex;align-items:center;gap:10px}
.marca b{color:var(--oro);font-weight:500}
.usuario{font-size:12px;color:var(--cal2);text-align:right;line-height:1.35;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.usuario button{background:none;border:1px solid rgba(212,175,106,.4);border-radius:30px;padding:4px 12px;font-size:12px;color:var(--cal)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,7,11,.88);border-top:1px solid rgba(212,175,106,.4);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:none;border-top:2px solid transparent;padding:13px 4px 12px;font-weight:500;font-size:14px;color:var(--cal2);min-height:48px}
nav button.on{color:var(--oro);border-top-color:var(--oro)}

/* Ligas y días */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(212,175,106,.3);background:rgba(255,255,255,.06);color:var(--cal);border-radius:30px;padding:8px 15px;font-weight:500;font-size:14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--oro);color:var(--vino2);border-color:var(--oro)}
.dias{gap:18px;border-bottom:1px solid var(--linea);padding-top:6px}
.dias .chip{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 2px 9px;color:var(--cal2);text-align:center;min-width:auto}
.dias .chip.on{background:none;color:var(--cal);border-bottom-color:var(--oro)}
.chip small{display:block;font-size:11px;font-weight:400;opacity:.8}

/* Línea más segura del día */
.pickdia{margin:14px 0 4px;background:var(--panelV);border:1px solid rgba(212,175,106,.4);padding:16px;display:flex;flex-direction:column;gap:6px}
.pickdia .grande{font-family:'Jost',sans-serif;font-weight:500;font-size:44px;line-height:1}
.pickdia .fila-btns{align-items:center;margin:8px 0 0}
.pct{border:1.5px solid var(--oro);border-radius:30px;padding:8px 14px;font-family:'Jost',sans-serif;font-weight:500;font-size:17px;color:var(--oro)}
.brillo{background:linear-gradient(100deg,#d4af6a 40%,#f3dfae 50%,#d4af6a 60%);background-size:420px 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 2.8s linear infinite}

/* Lista de partidos */
.lista{margin:12px 0;background:var(--panel);border:1px solid var(--linea)}
.fila{width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid rgba(212,175,106,.16);padding:13px 14px;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;color:var(--cal);transition:background-color .15s}
.fila:last-child{border-bottom:none}
.fila:active{background-color:rgba(212,175,106,.12)}
.fcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.fhora{font-size:12px;color:var(--cal2);display:flex;align-items:center;gap:6px}
.fhora.envivo{color:#ff6b81}
.feq{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnum{display:flex;flex-direction:column;align-items:flex-end;min-width:54px}
.fnum b{font-family:'Jost',sans-serif;font-weight:500;font-size:24px;line-height:1.1}
.fnum small{font-size:12px}
i.vivo{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff6b81;animation:vivo 1.1s infinite}

/* Escudos */
.logo{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.logo.g{width:64px;height:64px}
.logo.m{width:22px;height:22px;flex:0 0 auto}
.placa{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:12px;border:2px solid var(--oro)}
.placa.g{width:64px;height:64px;font-size:14px}
.placa.m{width:14px;height:14px;border-width:1.5px;flex:0 0 auto}

/* Detalle */
.volver{background:none;border:none;color:var(--oro);padding:10px 0;font-weight:500;min-height:44px;font-size:15px}
.herod{background:var(--panelV);border:1px solid rgba(212,175,106,.4);padding:14px 14px 16px}
.eqs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px;text-align:center}
.eq{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:'Jost',sans-serif;font-weight:500;font-size:16px;line-height:1.15}
.vs{font-family:'Jost',sans-serif;font-size:22px;color:var(--oro)}
.vs.mar{font-size:34px;color:var(--cal)}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:rgba(212,175,106,.35);margin-top:16px}
.dos>div{background:rgba(42,12,19,.92);padding:8px 10px}
.enorme{font-family:'Jost',sans-serif;font-weight:500;font-size:40px;line-height:1.05}
.dos .sub{font-size:14px}
.dos .sub b{font-family:'Jost',sans-serif;font-weight:500;font-size:20px}
.seg2{display:flex;background:rgba(255,255,255,.07);border-radius:30px;padding:4px;margin-bottom:6px}
.seg2 button{flex:1;border:none;border-radius:30px;padding:9px 0;font-weight:500;font-size:14px;background:transparent;color:var(--cal);min-height:40px}
.seg2 button.on{background:var(--oro);color:var(--vino2)}
.pb{display:grid;grid-template-columns:78px 1fr 44px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(212,175,106,.16);font-size:15px}
.pb b{text-align:right}
.pista{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pista i{display:block;height:100%;border-radius:3px;transform-origin:left center}
.casa{display:flex;align-items:center;gap:10px}
.casa label{flex:1;font-size:14px;color:var(--cal2)}
.casa input{width:100px;border:1px solid var(--oro);border-radius:30px;padding:10px 12px;font-weight:600;font-size:16px;text-align:center;background:rgba(255,255,255,.06);color:var(--cal)}
.split{display:flex;height:34px;border-radius:30px;overflow:hidden;font-size:13px;font-weight:600;margin-top:10px}
.split span:first-child{display:flex;align-items:center;padding-left:12px;white-space:nowrap;background:var(--oro);color:var(--vino2);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.split span:last-child{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;white-space:nowrap;background:rgba(255,255,255,.1)}
.valor{font-size:14px;font-weight:600;margin-top:8px}
.graf{margin:10px 0 14px}
.gtit{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:6px}
.barras{position:relative;display:flex;align-items:flex-end;gap:7px}
.barras .guia{position:absolute;left:0;right:0;border-top:1.5px dashed var(--oro)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.bcol small{font-size:11px;color:var(--cal2)}
.bcol i{display:block;width:100%;border-radius:4px 4px 0 0;transform-origin:bottom center}

/* Bloques generales */
.estado{padding:16px;text-align:center;color:var(--cal2);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.bloque{background:var(--panel);border:1px solid var(--linea);padding:14px;margin:12px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bloque h3{font-family:'Jost',sans-serif;font-weight:500;font-size:19px;margin:16px 0 8px}
.bloque h3:first-child,.bloque .seg2+h3{margin-top:4px}
.num{font-family:'Jost',sans-serif;font-weight:500;font-size:30px;line-height:1;color:var(--oro)}
.num small{font-size:16px;color:var(--cal)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cal2)}
.lbl.oro{color:var(--oro)}
.nota{font-size:13px;color:var(--cal2);line-height:1.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.grid4 .num{font-size:28px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cal2);font-weight:500;text-align:center;padding:6px 4px;border-bottom:1px solid var(--linea)}
td{text-align:center;padding:8px 4px;border-bottom:1px solid rgba(212,175,106,.1);font-variant-numeric:tabular-nums}
td.alta{color:var(--vino2);background:var(--oro);font-weight:600;border-radius:6px}
td.seg{font-family:'Jost',sans-serif;font-weight:500;font-size:19px;color:var(--oro)}
td.seg small{font-family:'Archivo',sans-serif;font-size:12px;color:var(--cal)}
.aviso{font-size:14px;color:#ffd9a0;background:rgba(255,217,160,.08);border:1px solid rgba(255,217,160,.4);padding:9px 11px;margin:10px 0}
.btn{background:var(--oro);color:var(--vino2);border:none;border-radius:30px;padding:12px 18px;font-weight:600;font-size:15px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:transparent;color:var(--cal);border:1px solid rgba(212,175,106,.45)}
.btn.chico{padding:6px 12px;font-size:13px;min-height:36px}
.btn:disabled{opacity:.75}
.fila-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.firma{font-size:12px;color:var(--cal2);text-align:center;padding:18px 0 6px}
.form{display:grid;gap:8px}
.form input,.form select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,106,.35);color:var(--cal);border-radius:30px;padding:11px 16px}
.form label{font-size:13px;color:var(--cal2);display:flex;align-items:center;gap:8px}
.usr{border-bottom:1px solid var(--linea);padding:10px 0}
.usr .n{font-weight:600;font-size:16px}
.usr .d{font-size:12px;color:var(--cal2);margin:2px 0 6px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:30px;padding:2px 8px;margin-left:6px}
.pill.ok{background:var(--oro);color:var(--vino2)}
.pill.no{background:var(--rojo);color:var(--vino2)}
.pill.eq{background:#a7d3f2;color:var(--vino2)}
.pick{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid rgba(212,175,106,.16)}
.pick .q{font-weight:600;font-size:15px}
.pick .p{font-family:'Jost',sans-serif;font-weight:500;font-size:24px;color:var(--oro);grid-row:span 2;align-self:center}
.pick .s{font-size:12px;color:var(--cal2)}
.res{grid-row:span 2;align-self:center;min-width:34px;height:34px;border-radius:30px;display:grid;place-items:center;font-weight:600;font-size:16px;padding:0 8px}
.res.g{background:var(--oro);color:var(--vino2)}
.res.p{background:rgba(242,167,167,.18);color:var(--rojo)}
.res.nd,.res.pend{background:rgba(255,255,255,.08);color:var(--cal2);font-size:12px}
#marca-agua{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07}
.demo{background:var(--oro);color:var(--vino2);text-align:center;font-size:13px;font-weight:600;padding:4px}

/* Pantallas de entrada */
.pantalla{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px 24px;gap:12px;max-width:440px;margin:0 auto}
.pantalla h2{font-family:'Jost',sans-serif;font-weight:500;font-size:26px}
.pantalla p{color:var(--cal2);line-height:1.5}
.marca.grande{font-size:36px;letter-spacing:2px}
.lema{font-size:12px;letter-spacing:3px;color:var(--oro)}
.ticker{display:flex;flex-direction:column;align-items:center;min-height:52px;margin-top:14px}
.ticker b{font-family:'Jost',sans-serif;font-weight:500;font-size:26px}
.ticker span{font-size:13px;color:var(--cal2)}
.puntos{display:flex;gap:6px;justify-content:center}
.puntos i{height:6px;width:6px;border-radius:3px;background:rgba(212,175,106,.35);transition:width .3s}
.puntos i.on{width:22px;background:var(--oro)}
.login{width:100%;display:flex;flex-direction:column;gap:9px;text-align:left;background:rgba(20,7,11,.62);border:1px solid rgba(212,175,106,.35);padding:18px 16px;margin-top:16px}
.login label{font-size:13px;color:var(--cal2)}
.login input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,106,.35);border-radius:30px;padding:12px 16px;color:var(--cal);font-size:16px}
.login input:focus,.form input:focus,.casa input:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(212,175,106,.28)}
.pass{position:relative}
.pass input{padding-right:54px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;background:none;color:var(--oro);display:grid;place-items:center}
.error{min-height:18px;font-size:13px;color:var(--rojo)}
.enlace{background:none;border:none;color:var(--cal2);font-weight:500;font-size:14px;min-height:40px}
.aviso-login{color:#ffd9a0 !important;font-size:14px}
.cargando{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--cal2)}
.bienv{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 0}
.bienv .bt{font-family:'Jost',sans-serif;font-weight:500;font-size:26px}

/* Movimiento */
@keyframes hazA{from{transform:rotate(-40deg)}to{transform:rotate(-16deg)}}
@keyframes hazB{from{transform:rotate(40deg)}to{transform:rotate(16deg)}}
@keyframes gradas{to{stroke-dashoffset:-34}}
@keyframes foco{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes alza{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(212,175,106,.6)}70%{box-shadow:0 0 0 12px rgba(212,175,106,0)}100%{box-shadow:0 0 0 0 rgba(212,175,106,0)}}
@keyframes vivo{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes brillo{0%{background-position:-160px 0}100%{background-position:260px 0}}
@keyframes traza{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes agita{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes check{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes anillo{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.sube{animation:sube .45s cubic-bezier(.2,.7,.2,1) both}
.entra{animation:entra .42s cubic-bezier(.2,.7,.2,1) both}
.crece{animation:crece .7s cubic-bezier(.2,.7,.2,1) both}
.alza{animation:alza .65s cubic-bezier(.2,.7,.2,1) both}
.pulso{animation:pulso 2.2s infinite}
.traza{stroke-dasharray:160;animation:traza 1.4s cubic-bezier(.6,0,.2,1) both}
.letraD{animation:aparece .5s 1.1s both}
.e1{animation:sube .6s .3s cubic-bezier(.2,.7,.2,1) both}
.e2{animation:sube .6s .5s cubic-bezier(.2,.7,.2,1) both}
.e3{animation:sube .6s .7s cubic-bezier(.2,.7,.2,1) both}
.e4{animation:sube .6s .9s cubic-bezier(.2,.7,.2,1) both}
.agita{animation:agita .4s ease both}
.gira{animation:gira .8s linear infinite}
.check{stroke-dasharray:40;animation:check .5s .25s ease-out both}
.anillo{animation:anillo .45s cubic-bezier(.2,.7,.2,1.3) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.brillo{color:var(--oro)}}
</style>
</head>
<body>
<div id="fondo" aria-hidden="true">
  <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice">
    <defs><linearGradient id="gHaz" gradientUnits="userSpaceOnUse" x1="0" y1="222" x2="0" y2="900"><stop offset="0" stop-color="#f3dfae" stop-opacity=".36"/><stop offset=".8" stop-color="#f3dfae" stop-opacity="0"/></linearGradient></defs>
    <g class="hazA"><polygon points="27,222 33,222 150,940 -90,940" fill="url(#gHaz)"/></g>
    <g class="hazB"><polygon points="357,222 363,222 480,940 240,940" fill="url(#gHaz)"/></g>
    <ellipse cx="195" cy="600" rx="300" ry="150" fill="none" stroke="rgba(212,175,106,0.2)" stroke-width="1.5"/>
    <ellipse class="gradas" cx="195" cy="600" rx="262" ry="128" fill="none" stroke="rgba(243,223,174,0.6)" stroke-width="3" stroke-dasharray="1.5 7"/>
    <ellipse class="gradas" cx="195" cy="600" rx="228" ry="108" fill="none" stroke="rgba(243,223,174,0.42)" stroke-width="3" stroke-dasharray="1.5 6"/>
    <ellipse cx="195" cy="600" rx="196" ry="90" fill="rgba(212,175,106,0.05)" stroke="rgba(212,175,106,0.5)" stroke-width="1.5"/>
    <path d="M110 560 L280 560 L340 660 L50 660 Z" fill="rgba(212,175,106,0.08)" stroke="rgba(212,175,106,0.65)" stroke-width="1.2"/>
    <line x1="195" y1="560" x2="195" y2="660" stroke="rgba(212,175,106,0.6)" stroke-width="1"/>
    <ellipse cx="195" cy="608" rx="34" ry="14" fill="none" stroke="rgba(212,175,106,0.6)" stroke-width="1"/>
    <line x1="30" y1="230" x2="30" y2="560" stroke="rgba(212,175,106,0.4)" stroke-width="2"/>
    <line x1="360" y1="230" x2="360" y2="560" stroke="rgba(212,175,106,0.4)" stroke-width="2"/>
    <rect class="foco" x="14" y="216" width="32" height="12" rx="2" fill="#f3dfae"/>
    <rect class="foco" x="344" y="216" width="32" height="12" rx="2" fill="#f3dfae"/>
  </svg>
  <div class="velo"></div>
</div>

// Promedio base de remates por equipo por partido [totales, a puerta]; se reemplaza poco a poco con los datos reales
const BASE = {
  'mex.1':[12.3,4.2], 'eng.1':[12.6,4.3], 'esp.1':[11.9,4.0], 'ita.1':[12.8,4.2], 'usa.1':[12.7,4.4],

};
const N_ULTIMOS = 10;   // partidos recientes que se usan por equipo
const DECAY = 0.88;     // peso de cada partido hacia atrás (el más reciente pesa más)
const K_SHRINK = 2.5;   // cuánto se jala hacia el promedio de la liga cuando hay pocos datos
const LOCAL = 1.06, VISITA = 0.94; // ventaja de localía
const DISP_T = 1.45, DISP_P = 1.25; // dispersión (varianza/media) para remates totales y a puerta

function promedioLiga(partidos, liga){
  let t=0,n=0,o=0,no=0;
  for (const p of partidos){
    if (p.liga !== liga || !p.stats) continue;
    t += p.stats.local.tiros + p.stats.visita.tiros; n += 2;
    if (p.stats.local.puerta != null && p.stats.visita.puerta != null){ o += p.stats.local.puerta + p.stats.visita.puerta; no += 2; }
  }
  const b = BASE[liga] || BASE.def, kb = 20;
  return [(t + b[0]*kb)/(n + kb), (o + b[1]*kb)/(no + kb)];
}

// lista: partidos terminados del equipo, del más reciente al más antiguo
function perfilEquipo(lista, id){
  let W=0, at=0, df=0, Wp=0, ap=0, dp=0; const ult=[];
  for (const p of lista){
    if (!p.stats) continue;
    const loc = p.local.id === id;
    const yo = loc ? p.stats.local : p.stats.visita, el = loc ? p.stats.visita : p.stats.local;
    const w = Math.pow(DECAY, ult.length);
    W += w; at += w*yo.tiros; df += w*el.tiros;
    if (yo.puerta != null && el.puerta != null){ Wp += w; ap += w*yo.puerta; dp += w*el.puerta; }
    ult.push({fecha:p.fecha, liga:p.liga, rival: loc ? p.visita : p.local, local:loc,
      tiros:yo.tiros, puerta:yo.puerta, contra:el.tiros, contraP:el.puerta});
  }
  return {W, Wp, at: W?at/W:null, df: W?df/W:null, ap: Wp?ap/Wp:null, dp: Wp?dp/Wp:null, ult, n:ult.length};
}

function encoger(v, w, L){ return v == null ? L : (v*w + L*K_SHRINK)/(w + K_SHRINK); }

function proyectar(pl, pv, L){
  const [Lt, Lp] = L;
  const lt = encoger(pl.at,pl.W,Lt) * encoger(pv.df,pv.W,Lt) / Lt * LOCAL;
  const vt = encoger(pv.at,pv.W,Lt) * encoger(pl.df,pl.W,Lt) / Lt * VISITA;
  const lp = encoger(pl.ap,pl.Wp,Lp) * encoger(pv.dp,pv.Wp,Lp) / Lp * LOCAL;
  const vp = encoger(pv.ap,pv.Wp,Lp) * encoger(pl.dp,pl.Wp,Lp) / Lp * VISITA;
  return {local:{tiros:lt,puerta:lp}, visita:{tiros:vt,puerta:vp}, total:{tiros:lt+vt,puerta:lp+vp}, muestra:Math.min(pl.n,pv.n)};
}

// Probabilidad de que salgan MÁS remates que la línea (binomial negativa)
function probMas(mu, disp, linea){
  if (!(mu > 0)) return 0;
  const v = mu*disp, r = mu*mu/(v - mu), p = r/(r + mu), k = Math.floor(linea);
  let pk = Math.pow(p, r), cdf = pk;
  for (let i = 0; i < k; i++){ pk = pk*(i + r)/(i + 1)*(1 - p); cdf += pk; }
  return Math.max(0, Math.min(1, 1 - cdf));
}

function lineasPara(mu, paso, n){
  const c = Math.floor(mu) + 0.5, out = [];
  for (let i = -n; i <= n; i++){ const l = c + i*paso; if (l > 0) out.push(l); }
  return out;
}

function mercados(pr, nl, nv){
  return [
    {clave:'tt', nombre:'Remates totales del partido', mu:pr.total.tiros, disp:DISP_T, lineas:lineasPara(pr.total.tiros,2,2)},
    {clave:'pt', nombre:'Remates a puerta del partido', mu:pr.total.puerta, disp:DISP_P, lineas:lineasPara(pr.total.puerta,1,2)},
    {clave:'tl', nombre:'Remates totales · '+nl, mu:pr.local.tiros, disp:DISP_T, lineas:lineasPara(pr.local.tiros,1,2)},
    {clave:'tv', nombre:'Remates totales · '+nv, mu:pr.visita.tiros, disp:DISP_T, lineas:lineasPara(pr.visita.tiros,1,2)},
    {clave:'pl', nombre:'Remates a puerta · '+nl, mu:pr.local.puerta, disp:DISP_P, lineas:lineasPara(pr.local.puerta,1,1)},
    {clave:'pv', nombre:'Remates a puerta · '+nv, mu:pr.visita.puerta, disp:DISP_P, lineas:lineasPara(pr.visita.puerta,1,1)}
  ].map(m => ({...m, filas: m.lineas.map(l => ({linea:l, mas:probMas(m.mu, m.disp, l)}))}));
}

// Línea segura: la línea más alta de "Más de" con al menos 70% de probabilidad
function lineaSegura(mu, disp, minProb){
  minProb = minProb || 0.70;
  for (let l = Math.floor(mu) + 0.5; l > 0; l -= 1){
    const pr = probMas(mu, disp, l);
    if (pr >= minProb) return {linea:l, prob:pr};
  }
  return null;
}

/* ---------- 5. DATOS ESPN ---------- */
function leerStats(arr){
  if (!arr || !arr.length) return null;
  const m = {};
  arr.forEach(s => { m[s.name] = parseFloat(s.displayValue != null ? s.displayValue : s.value); });
  const t = m.totalShots, o = (m.shotsOnTarget != null ? m.shotsOnTarget : m.shotsOnGoal);
  if (!isFinite(t)) return null;
  return {tiros:t, puerta: isFinite(o) ? o : null};
}
function parseEvento(e, liga){
  const c = e.competitions && e.competitions[0]; if (!c || !c.competitors) return null;
  const h = c.competitors.find(x => x.homeAway === 'home'), a = c.competitors.find(x => x.homeAway === 'away');
  if (!h || !a || !h.team || !a.team) return null;
  const eq = x => ({id:String(x.team.id), nombre:x.team.shortDisplayName || x.team.displayName, abrev:x.team.abbreviation || '',
    logo:x.team.logo || '', color:x.team.color || '1b5e20', alt:x.team.alternateColor || 'ffffff', goles:x.score});
  const st = (c.status && c.status.type) || {};
  let estado = st.state || 'pre';
  if (/POSTPONED|CANCELED|CANCELLED|ABANDONED|SUSPENDED/.test(st.name || '')) estado = 'canc';
  else if (estado === 'post' && st.completed === false) estado = 'canc';
  const p = {id:String(e.id), liga, fecha:e.date, estado, detalle:st.shortDetail || '', local:eq(h), visita:eq(a), stats:null};
  const sh = leerStats(h.statistics), sa = leerStats(a.statistics);
  if (estado === 'post' && sh && sa) p.stats = {local:sh, visita:sa};
  return p;
}
function guardar(p){
  if (!p.stats && p.estado === 'post'){ const c = lsGet('dr_st_' + p.id); if (c) p.stats = c; }
  const prev = S.partidos.get(p.id);
  if (prev && prev.stats && !p.stats) p.stats = prev.stats;
  S.partidos.set(p.id, p);
}
async function cargarLiga(liga, forzar){
  if (S.cargadas[liga] && !forzar) return;
  const key = 'dr_sb3_' + liga, c = lsGet(key);
  if (!forzar && c && Date.now() - c.t < 30*60e3){ c.p.forEach(guardar); S.cargadas[liga] = true; return; }
  // ESPN no acepta rangos de fechas en fútbol: se lee el calendario de la liga y se baja día por día
  const h = hoyKey(), desde = ymd(sumarDias(h,-80)), hasta = ymd(sumarDias(h,8));
  const j = await getJSON(`${ESPN}${liga}/scoreboard`);
  const fechas = new Set(), add = iso => { if (iso) fechas.add(String(iso).slice(0,10).replace(/-/g,'')); };
  // Torneos UEFA dan rangos de meses (fase de liga, octavos...): se revisa cada día del rango que cae en la ventana
  const aFecha = k => new Date(k.slice(0,4) + '-' + k.slice(4,6) + '-' + k.slice(6,8) + 'T12:00:00Z');
  const rango = (a, b) => { if (!a) return; if (!b){ add(a); return; }
    const ini = String(a).slice(0,10).replace(/-/g,''), fin = String(b).slice(0,10).replace(/-/g,'');
    const d0 = ini > desde ? ini : desde, d1 = fin < hasta ? fin : hasta; if (d0 > d1) return;
    for (let d = aFecha(d0); d <= aFecha(d1); d.setUTCDate(d.getUTCDate() + 1)) add(d.toISOString()); };
  const cal = ((j.leagues || [])[0] || {}).calendar || [];
  cal.forEach(c => { if (typeof c === 'string') add(c); else { rango(c.startDate, c.endDate); (c.entries || []).forEach(e => rango(e.startDate, e.endDate)); } });
  const dias = [...fechas].filter(d => d >= desde && d <= hasta).sort();
  const eventos = new Map(); (j.events || []).map(e => parseEvento(e, liga)).filter(Boolean).forEach(p => eventos.set(p.id, p));
  // Los días ya terminados no cambian: se guardan en el celular y no se vuelven a pedir a ESPN
  const cerrado = ymd(sumarDias(h, -2)), pedir = [];
  dias.forEach(d => { const c = d <= cerrado ? lsGet('dr_d_' + liga + '_' + d) : null;
    if (c) c.forEach(p => eventos.set(p.id, p)); else pedir.push(d); });
  let fallas = 0;
  await pool(pedir, 10, async d => {
    try {
      const r = await getJSON(`${ESPN}${liga}/scoreboard?dates=${d}`);
      const ps = (r.events || []).map(e => parseEvento(e, liga)).filter(Boolean);
      ps.forEach(p => eventos.set(p.id, p));
      if (d <= cerrado && ps.every(p => p.estado === 'post' || p.estado === 'canc')) lsSet('dr_d_' + liga + '_' + d, ps.map(p => Object.assign({}, p, {stats:null})));
    } catch(e){ fallas++; }
  }, (n, t) => { S.progreso = `Bajando ${nombreLiga(liga)} ${n}/${t}…`; const e = $('#progreso'); if (e) e.textContent = S.progreso; });
  if (pedir.length && fallas === pedir.length && !eventos.size) throw new Error('ESPN no respondió');
  const lista = [...eventos.values()];
  lista.forEach(guardar);
  lsSet(key, {t:Date.now(), p:lista});
  S.cargadas[liga] = true;
}
async function statsDeResumen(p){
  const j = await getJSON(`${ESPN}${p.liga}/summary?event=${p.id}`);
  const ts = (j.boxscore && j.boxscore.teams) || [];
  const f = id => { const t = ts.find(x => x.team && String(x.team.id) === String(id)); return t ? leerStats(t.statistics) : null; };
  const sl = f(p.local.id), sv = f(p.visita.id);
  if (sl && sv){ p.stats = {local:sl, visita:sv}; lsSet('dr_st_' + p.id, p.stats); }
  else p.sinStats = true;
}
function ultimos(id, n, antes){
  return [...S.partidos.values()]
    .filter(p => p.estado === 'post' && (p.local.id === id || p.visita.id === id) && (!antes || p.fecha < antes))
    .sort((a,b) => b.fecha.localeCompare(a.fecha)).slice(0, n);
}
async function asegurarStats(ids){
  const pend = new Set();
  ids.forEach(id => ultimos(id, N_ULTIMOS + 2).forEach(p => { if (!p.stats && !p.sinStats) pend.add(p); }));
  if (!pend.size) return;
  await pool([...pend], 12, p => statsDeResumen(p).catch(() => { p.sinStats = true; }), (h,t) => {
    S.progreso = `Bajando estadísticas ${h}/${t}…`; const e = $('#progreso'); if (e) e.textContent = S.progreso;
  });
  S.progreso = '';
}

  await cargarLiga(liga);
  if (liga.startsWith('uefa.')) await Promise.all(APOYO.map(l => cargarLiga(l).catch(() => {})));

function proyeccionDe(p){
  if (p._pub) return p._pub;
  const pl = perfilEquipo(ultimos(p.local.id, N_ULTIMOS, p.fecha), p.local.id);
  const pv = perfilEquipo(ultimos(p.visita.id, N_ULTIMOS, p.fecha), p.visita.id);
  const L = promedioLiga(S.partidos.values(), p.liga);
  return {pr: proyectar(pl, pv, L), pl, pv, L};
}

function logoChico(url, px){

}
function escudo(eq, tam){

  const px = tam === 'g' ? 144 : tam === 'm' ? 48 : 96;
  if (eq.logo) return `<img class="${cls}" src="${esc(logoChico(eq.logo, px))}" alt="" loading="lazy" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${esc(eq.logo)}'}else{this.outerHTML='${placaTxt(eq, tam)}'}">`;
  return placaHtml(eq, tam);
}
function placaHtml(eq, tam){ return `<span class="placa${tam === 'm' ? ' m' : tam === 'g' ? ' g' : ''}" style="background:#${esc(eq.color)};color:#${esc(eq.alt)}">${tam === 'm' ? '' : esc(eq.abrev)}</span>`; }
function placaTxt(eq, tam){ return placaHtml(eq, tam).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const HEX = (t, anim) => `<svg width="${t}" height="${t}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="${anim ? 9 : 7}" fill="#4a1220"/><circle ${anim ? 'class="traza"' : ''} cx="20" cy="20" r="16.5" fill="none" stroke="#fbf8f3" stroke-width="${anim ? 1.4 : 1.8}"/><g ${anim ? 'class="letraD"' : ''} font-family="Archivo, Arial, sans-serif" font-weight="700" font-style="italic" text-anchor="middle"><text x="20" y="19" font-size="9.6" fill="#fbf8f3">DICA</text><text x="20" y="28.4" font-size="9.6" fill="#d4af6a">REM</text></g></svg>`;
const GIRA = (t) => `<svg class="gira" width="${t || 18}" height="${t || 18}" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" fill="none" stroke="rgba(212,175,106,.25)" stroke-width="6"/><path d="M26 4a22 22 0 0 1 22 22" fill="none" stroke="#d4af6a" stroke-width="6" stroke-linecap="round"/></svg>`;

function animarCuentas(){
  const els = [...document.querySelectorAll('[data-cuenta]')];
  if (!els.length || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const fin = els.map(e => +e.dataset.cuenta), t0 = performance.now();
  const paso = () => {
    const t = Math.min(1, (performance.now() - t0) / 850), k = 1 - Math.pow(1 - t, 3);
    els.forEach((e, i) => { e.textContent = Math.round(fin[i] * k); });
    if (t < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

}

function filaPartido(p, i, A){

function vistaDetalle(){

  const m = mercados(pr, p.local.nombre, p.visita.nombre).find(x => x.clave === tipo);
  S._det = {mu: m.mu, disp: m.disp};
  const barras = m.filas.map((f, i) => { const alta = f.mas >= .6;
    return `<div class="pb"><span>Más ${f.linea}</span><span class="pista"><i class="${A ? 'crece' : ''}" style="width:${pct(f.mas)};background:${alta ? 'var(--oro)' : 'rgba(205,188,175,.45)'};animation-delay:${i * 60}ms"></i></span><b style="color:${alta ? 'var(--oro)' : 'var(--cal)'}">${pct(f.mas)}</b></div>`; }).join('');

function verTipo(t){ S.tipoDet = t; S._anim = true; render(); }
function compararCasa(v){
  const el = $('#comp'); if (!el || !S._det) return;
  const n = parseFloat(String(v).replace(',', '.'));
  if (!(n > 0)){ el.innerHTML = ''; return; }
  const pM = probMas(S._det.mu, S._det.disp, n), pN = 1 - pM, req = 0.524, hay = pM > req || pN > req;
  const valor = pM > req ? `Más tiene valor a -110 (+${((pM - req) * 100).toFixed(1)}%)` : pN > req ? `Menos tiene valor a -110 (+${((pN - req) * 100).toFixed(1)}%)` : 'Sin valor a -110';
  if (!el.querySelector('.split')) el.innerHTML = '<div class="split"><span style="width:50%"></span><span></span></div><div class="valor"></div>';
  const [a, b] = el.querySelector('.split').children, val = el.querySelector('.valor');
  a.style.width = Math.max(18, Math.min(82, Math.round(pM * 100))) + '%'; a.textContent = 'Más ' + pct(pM); b.textContent = 'Menos ' + pct(pN);
  val.textContent = valor; val.style.color = hay ? 'var(--verde)' : 'var(--cal2)';
}

/* ---------- 7. PICKS E IMÁGENES (solo admin) ---------- */
function picksPublicados(dia){
  return S.resumen ? S.resumen.recientes.filter(x => x.dia === dia).sort((a,b) => a.fecha.localeCompare(b.fecha)) : [];
}
function etiquetaRes(x){
  if (x.estado === 'g') return '✓'; if (x.estado === 'p') return '✗'; if (x.estado === 'nd') return 's/d';
  return Date.parse(x.fecha) > Date.now() ? horaMx(x.fecha) : 'en juego';
}
function listaPicks(lista, publicados){
  return '<div class="bloque">' + lista.map(k => `<div class="pick">
      <div class="q">${esc(k.texto)}</div>
      ${publicados ? `<div class="res ${k.estado}">${esc(etiquetaRes(k))}</div>` : `<div class="p">${pct(k.prob)}</div>`}
      <div class="s">${esc(k.partido)} · ${esc(nombreLiga(k.liga))} · ${esc(horaMx(k.fecha))} · ${pct(k.prob)}${k.mu != null ? ' · proy. ' + f1(k.mu) : ''}${k.real != null ? ' · salieron ' + k.real : ''}</div></div>`).join('') + '</div>';

function vistaPicks(){
  let html = chipsDias();
  if (S.cargando) return html + `<div class="estado" id="progreso">${esc(S.progreso || 'Cargando…')}</div>`;
  const pub = picksPublicados(S.dia), gen = S.picks && S.picks.dia === S.dia ? S.picks.lista : null;
  if (gen){
    html += `<div class="aviso">Estos picks todavía NO están publicados${pub.length ? `; al publicarlos reemplazan a los ${pub.length} que ya tenías` : ''}.</div>
      <div class="fila-btns">${gen.length ? '<button class="btn" onclick="publicarPicks()">Publicar picks</button>' : ''}<button class="btn sec" onclick="descartarPicks()">Descartar</button></div>`;
    return html + (gen.length ? listaPicks(gen, false) : '<div class="estado">No hay partidos pendientes con datos suficientes ese día.</div>');
  }
  if (pub.length){
    const c = (S.resumen.dias || {})[S.dia] || {};
    html += `<div class="bloque" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px">
      <div><div class="lbl">Picks publicados</div><div style="font-weight:700">${pub.length} picks · ${c.g || 0}-${c.p || 0}${c.pend ? ` · ${c.pend} pendientes` : ''}</div></div></div>
      <div class="fila-btns"><button class="btn sec" onclick="imagenPicks()">Imagen para redes</button><button class="btn sec" onclick="generarPicks()">Volver a generar</button></div>`;
    return html + listaPicks(pub, true);
  }
  return html + `<div class="fila-btns"><button class="btn" onclick="generarPicks()">Generar picks del día</button></div>
    <div class="estado">${DEMO ? 'En modo demo los picks no se guardan.' : 'Aún no hay picks publicados para este día.'}</div>`;
}
function descartarPicks(){ S.picks = null; render(); }
async function cargarPicksVista(){
  if (DEMO || S.resumen) return render();
  S.cargando = true; render();
  try { const snap = await refResumen().get(); S.resumen = snap.exists ? Object.assign(vacioResumen(), snap.data()) : vacioResumen(); }
  catch(e){}
  S.cargando = false; if (S.vista === 'picks') render();
}
async function generarPicks(){
  S.cargando = true; S.progreso = 'Cargando las 8 ligas…'; render();
  try {
    await Promise.all(LIGAS.map(l => prepararLiga(l.id).catch(() => {})));
    const ps = partidosDelDia('todas', S.dia).filter(p => p.estado === 'pre');
    const ids = new Set(); ps.forEach(p => { ids.add(p.local.id); ids.add(p.visita.id); });
    await asegurarStats([...ids]);
    const lista = [];
    ps.forEach(p => {
      const {pr} = proyeccionDe(p); if (pr.muestra < 3) return;
      const nom = p.local.nombre + ' vs ' + p.visita.nombre;
      const sT = lineaSegura(pr.total.tiros, DISP_T, .72), sP = lineaSegura(pr.total.puerta, DISP_P, .72);
      const base = {id:p.id, lid:p.local.id, vid:p.visita.id, partido:nom, liga:p.liga, fecha:p.fecha};
      if (sT) lista.push(Object.assign({texto:`Más de ${sT.linea} remates`, tipo:'tt', linea:sT.linea, prob:sT.prob, mu:pr.total.tiros}, base));
      if (sP) lista.push(Object.assign({texto:`Más de ${sP.linea} remates a puerta`, tipo:'pt', linea:sP.linea, prob:sP.prob, mu:pr.total.puerta}, base));
    });
    lista.sort((a,b) => a.fecha.localeCompare(b.fecha));
    S.picks = {dia:S.dia, lista};
  } finally { S.cargando = false; render(); }
}
function lienzo(alto){
  const c = document.createElement('canvas'); c.width = 1080; c.height = alto; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, alto); g.addColorStop(0, '#4a1220'); g.addColorStop(.55, '#1c070d'); g.addColorStop(1, '#060205');
  x.fillStyle = g; x.fillRect(0, 0, 1080, alto);
  x.strokeStyle = 'rgba(212,175,106,.55)'; x.lineWidth = 3; x.strokeRect(40, 40, 1000, alto - 80);
  x.beginPath(); x.ellipse(540, alto - 230, 430, 150, 0, 0, Math.PI * 2); x.strokeStyle = 'rgba(212,175,106,.18)'; x.lineWidth = 3; x.stroke();
  x.fillStyle = '#fbf8f3'; x.font = '500 92px Jost'; x.textAlign = 'center';
  x.fillText('DICA', 370, 180); x.fillStyle = '#d4af6a'; x.fillText('REMATES', 660, 180);
  return [c, x];
}
function pie(x, alto){ x.fillStyle = 'rgba(251,248,243,.75)'; x.font = '500 34px Archivo'; x.textAlign = 'center'; x.fillText('By: Ricardo Dionicio', 540, alto - 100); }
function descargar(c, nombre){
  try { c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nombre; a.click(); }); }
  catch(e){ alert('No se pudo generar la imagen: ' + e.message); }
}
async function imagenPicks(){

  const lista = (S.picks && S.picks.dia === S.dia) ? S.picks.lista : picksPublicados(S.dia);
  const n = Math.min(lista.length, 10), alto = 360 + n*110 + 160;
  const [c, x] = lienzo(alto);
  const [a, b] = etiquetaDia(S.dia);
  x.fillStyle = '#fbf8f3'; x.font = '700 46px Jost'; x.fillText(`Picks de remates · ${a} ${b}`, 540, 250);
  lista.slice(0, n).forEach((k, i) => {

/* ---------- RÉCORD (usuarios y admin) Y REVISIÓN DEL MODELO (solo admin) ---------- */
const CAL_BUCKETS = ['50-59','60-69','70-79','80-89','90+'];
const bucketDe = pr => pr < .6 ? '50-59' : pr < .7 ? '60-69' : pr < .8 ? '70-79' : pr < .9 ? '80-89' : '90+';
const refResumen = () => db.collection('historial').doc('resumen');
const refModelo = () => db.collection('modelo').doc('resumen');
const vacioResumen = () => ({dias:{}, recientes:[], jornadasPend:[]});
const vacioModelo = () => ({n:0, sAbsT:0, sT:0, nP:0, sAbsP:0, sP:0, ligas:{}, cal:{}, ultimos:[]});
const TERMINADO_MS = 2.5*3600e3;
const limpio = o => JSON.parse(JSON.stringify(o));

function contarDia(R, dia){
  const c = {g:0, p:0, nd:0, pend:0};
  R.recientes.filter(x => x.dia === dia).forEach(x => { c[x.estado] = (c[x.estado] || 0) + 1; });
  R.dias[dia] = c;
}
async function statsPartido(x){
  const prev = S.partidos.get(String(x.id));
  if (prev && prev.stats) return prev.stats;
  const c = lsGet('dr_st_' + x.id); if (c) return c;
  const p = {id:String(x.id), liga:x.liga, local:{id:String(x.lid)}, visita:{id:String(x.vid)}};
  try { await statsDeResumen(p); } catch(e){}
  return p.stats || null;
}
async function publicarPicks(){
  if (!S.picks || !S.picks.lista.length) return;
  if (DEMO) return alert('Modo demo: no se guardan picks');
  const dia = S.picks.dia;

    const items = S.picks.lista.map(k => ({dia, id:k.id, liga:k.liga, lid:k.lid, vid:k.vid, fecha:k.fecha, partido:k.partido,
      texto:k.texto, tipo:k.tipo, linea:k.linea, prob:k.prob, mu:k.mu, estado:'pend', real:null}));
    R.recientes = R.recientes.filter(x => x.dia !== dia).concat(items).sort((a,b) => b.fecha.localeCompare(a.fecha)).slice(0, 400);
    contarDia(R, dia); R.actualizado = new Date().toISOString();

  } catch(e){ alert('No se pudieron publicar los picks: ' + e.message); }
}
function sumarModelo(M, e, st){
  const rt = st.local.tiros + st.visita.tiros, et = rt - e.pr.total.tiros;
  M.n++; M.sAbsT += Math.abs(et); M.sT += et;
  const L = M.ligas[e.liga] = M.ligas[e.liga] || {n:0, sAbsT:0, sT:0};
  L.n++; L.sAbsT += Math.abs(et); L.sT += et;
  const rp = (st.local.puerta != null && st.visita.puerta != null) ? st.local.puerta + st.visita.puerta : null;
  if (rp != null){ const ep = rp - e.pr.total.puerta; M.nP++; M.sAbsP += Math.abs(ep); M.sP += ep; }
  mercados(e.pr, '', '').filter(m => m.clave === 'tt' || m.clave === 'pt').forEach(m => {
    const real = m.clave === 'tt' ? rt : rp; if (real == null) return;
    m.filas.forEach(f => {
      const sobre = f.mas >= .5, pr = sobre ? f.mas : 1 - f.mas, k = bucketDe(pr);
      const b = M.cal[k] = M.cal[k] || {n:0, g:0, sp:0};
      b.n++; b.sp += pr; if (sobre === (real > f.linea)) b.g++;
    });
  });
  M.ultimos = [{partido:e.local.nombre + ' vs ' + e.visita.nombre, liga:e.liga, fecha:e.fecha, mu:e.pr.total.tiros, real:rt}].concat(M.ultimos || []).slice(0, 30);
}
let calificando = false;
async function calificar(){
  if (DEMO || !S.esAdmin || calificando) return; calificando = true;
  try {
    const snap = await refResumen().get(), R = Object.assign(vacioResumen(), snap.exists ? snap.data() : {});
    const ahora = Date.now(), tocados = new Set(); let cambios = false;
    for (const x of R.recientes){
      if (x.estado !== 'pend' || ahora - Date.parse(x.fecha) < TERMINADO_MS) continue;
      const st = await statsPartido(x); let real = null;
      if (st) real = x.tipo === 'pt'
        ? (st.local.puerta != null && st.visita.puerta != null ? st.local.puerta + st.visita.puerta : null)
        : st.local.tiros + st.visita.tiros;
      if (real != null){ x.real = real; x.estado = real > x.linea ? 'g' : 'p'; }
      else if (ahora - Date.parse(x.fecha) > 3*86400e3) x.estado = 'nd'; // sin dato después de 3 días: no cuenta
      else continue;
      tocados.add(x.dia); cambios = true;
    }
    tocados.forEach(d => contarDia(R, d));
    // Revisión del modelo: días publicados cuyos partidos ya terminaron
    const msnap = await refModelo().get(), M = Object.assign(vacioModelo(), msnap.exists ? msnap.data() : {});
    let mcambios = false; const quedan = [];
    for (const dia of (R.jornadasPend || [])){
      const jd = await db.collection('jornadas').doc(dia).get();
      if (!jd.exists){ cambios = true; continue; }
      const ps = (jd.data().partidos || []).filter(e => e.estado === 'pre');
      if (ps.some(e => ahora - Date.parse(e.fecha) < TERMINADO_MS)){ quedan.push(dia); continue; }
      for (const e of ps){
        const st = await statsPartido({id:e.id, liga:e.liga, lid:e.local.id, vid:e.visita.id});
        if (st){ sumarModelo(M, e, st); mcambios = true; }
      }
      cambios = true;
    }
    R.jornadasPend = quedan;
    if (mcambios){ M.actualizado = new Date().toISOString(); await refModelo().set(limpio(M)); S.modelo = M; }
    if (cambios){ R.actualizado = new Date().toISOString(); await refResumen().set(limpio(R)); }
    S.resumen = R;
  } catch(e){ console.warn('calificar', e); }
  finally { calificando = false; }
}

let turno = 0;
async function cargarVista(){
  const mio = ++turno; S.error = null; S.cargando = true; S.progreso = ''; render();
  try {
    if (!S.esAdmin){ await leerJornada(S.dia); if (mio === turno){ S.cargando = false; S._anim = true; render(); } return; }
    leerEstadoPub(S.dia).then(() => { if (mio === turno && !S.cargando) render(); });
    const ligas = S.liga === 'todas' ? LIGAS.map(l => l.id) : [S.liga];
    await Promise.all(ligas.map(l => prepararLiga(l)));
    if (mio !== turno) return;
    const ps = partidosDelDia(S.liga, S.dia).filter(visible);
    const ids = new Set(); ps.forEach(p => { ids.add(p.local.id); ids.add(p.visita.id); });
    await asegurarStats([...ids]);
  } catch(e){ S.error = e.message; }
  if (mio === turno){ S.cargando = false; S._anim = true; render(); }
}

/* ---------- 10. ACCESO, DISPOSITIVOS Y PROTECCIÓN ---------- */
function pantalla(titulo, texto, botones){
  clearInterval(S._tk);
  $('#app').innerHTML = `<div class="pantalla">
    ${HEX(78, true)}
    <div class="marca grande e1">DICA&nbsp;<b class="brillo">REMATES</b></div>
    <div class="lema e2">SI ES DICA, ES EXCELENCIA</div>
    ${titulo ? `<h2 class="e3">${esc(titulo)}</h2>` : ''}
    ${texto ? `<p class="e3">${texto}</p>` : ''}
    ${botones || ''}
    <div class="firma">By: Ricardo Dionicio · GROUP DICA · v12</div></div>`;
}
const TICKER = [['8 ligas', 'Liga MX, Premier, LaLiga, Serie A, MLS y torneos UEFA'], ['Líneas .5', 'listas para comparar con tu casa de apuestas'], ['Récord real', 'cada pick se califica con los remates de ESPN']];
function iniciarTicker(){
  let i = 0;
  const pinta = () => {
    const v = $('#tk-v'), t = $('#tk-t'), p = $('#tk-p'); if (!v){ clearInterval(S._tk); return; }
    v.textContent = TICKER[i][0]; t.textContent = TICKER[i][1];
    [v, t].forEach(e => { e.classList.remove('sube'); void e.offsetWidth; e.classList.add('sube'); });
    p.innerHTML = TICKER.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
    i = (i + 1) % TICKER.length;
  };
  clearInterval(S._tk); pinta(); S._tk = setInterval(pinta, 2600);
}
function pantallaLogin(aviso){
  pantalla('', '', `<div class="ticker e3" aria-live="polite"><b id="tk-v"></b><span id="tk-t"></span></div><div class="puntos e3" id="tk-p"></div>
    ${aviso ? `<p class="aviso-login e3">${esc(aviso)}</p>` : ''}
    <form class="login vidrio e4" id="f-login" onsubmit="iniciarSesion(event)" novalidate>
      <label for="l-email">Correo</label>
      <input id="l-email" type="email" autocomplete="username" placeholder="tucorreo@gmail.com">
      <label for="l-pass">Contraseña</label>
      <div class="pass"><input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="ojo" aria-label="Mostrar contraseña" onclick="verPass(this)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <div id="l-error" class="error" role="alert"></div>
      <button class="btn" type="submit" id="l-btn">Entrar</button>
      <button type="button" class="enlace" onclick="olvidePass()">Olvidé mi contraseña</button>
    </form>`);
  iniciarTicker();
}
function verPass(b){ const i = $('#l-pass'), ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; b.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña'); }
function pantallaRenovar(titulo, texto){
  pantalla(titulo, texto, `<a class="btn" style="text-decoration:none" href="${waLink()}" target="_blank" rel="noopener">Renovar por WhatsApp</a>
    <button class="btn sec" onclick="salir()">Salir</button>`);
}
function marcaAgua(email){
  const t = esc(email);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='320' height='200'><text x='10' y='110' transform='rotate(-25 160 100)' font-family='Arial' font-size='16' fill='white'>${t}</text></svg>`;
  $('#marca-agua').style.background = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
function proteger(email){
  document.body.classList.add('protegido'); marcaAgua(email);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keyup', e => { if (e.key === 'PrintScreen'){ try { navigator.clipboard.writeText(''); } catch(_){} } });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['p','s','c'].includes(e.key.toLowerCase())) e.preventDefault(); });
}
function entrar(){
  S._ultAct = 0; marcarActividad();
  S.dia = hoyKey();
  const sigue = () => { S._anim = true; render(); cargarVista(); };
  if (S._recien){
    S._recien = false; const n = ((S.perfil && S.perfil.nombre) || '').split(' ')[0];
    pantalla('', '', `<div class="bienv"><svg class="anillo" width="84" height="84" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="#d4af6a"/><path class="check" d="M24 39 L34 49 L53 29" fill="none" stroke="#2a0c13" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="bt">Bienvenido${n ? ', ' + esc(n) : ''}</div></div>`);
    setTimeout(sigue, 1200);
  } else sigue();
  if (S.esAdmin && !DEMO) setTimeout(calificar, 5000);
  setInterval(() => { if (!S.esAdmin && (vencido(S.perfil) || (S.perfil && S.perfil.suspendido))) pantallaRenovar('Tu acceso venció', 'Tu suscripción a DICA REMATES terminó. Renueva para seguir viendo las proyecciones.'); }, 60e3);
}
const ERRORES = {
  'auth/invalid-credential':'Correo o contraseña incorrectos.', 'auth/wrong-password':'Correo o contraseña incorrectos.',
  'auth/user-not-found':'Correo o contraseña incorrectos.', 'auth/invalid-email':'Escribe un correo válido.',
  'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.', 'auth/network-request-failed':'Sin conexión a internet.',
  'auth/email-already-in-use':'Ese correo ya tiene cuenta.', 'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.'
};
const msjError = e => ERRORES[e.code] || ('Error: ' + e.message);
async function iniciarSesion(ev){
  if (ev) ev.preventDefault();
  const email = $('#l-email').value.trim(), pass = $('#l-pass').value, err = $('#l-error'), btn = $('#l-btn'), f = $('#f-login');
  const agita = m => { err.textContent = m; f.classList.remove('agita'); void f.offsetWidth; f.classList.add('agita'); };
  err.textContent = '';
  if (!email || !pass) return agita('Escribe tu correo y contraseña.');
  lsSet('dr_act', Date.now()); S._ultAct = 0; S._recien = true;
  btn.disabled = true; btn.innerHTML = `${GIRA()} Entrando…`;
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ S._recien = false; btn.disabled = false; btn.textContent = 'Entrar'; agita(msjError(e)); }
}
async function olvidePass(){
  const email = $('#l-email').value.trim(), err = $('#l-error');
  if (!email){ err.textContent = 'Escribe tu correo arriba y vuelve a tocar aquí.'; return; }
  try { await auth.sendPasswordResetEmail(email); err.textContent = 'Te mandamos un correo para cambiar tu contraseña.'; }
  catch(e){ err.textContent = msjError(e); }
}
function salir(){ lsSet('dr_act', null); if (auth) auth.signOut(); }
const INACTIVO_MS = 30*60e3;
function marcarActividad(){ const t = Date.now(); if (t - (S._ultAct || 0) > 15000){ S._ultAct = t; lsSet('dr_act', t); } }
function revisarInactividad(){
  if (DEMO || !S.usuario || !auth) return;
  const u = lsGet('dr_act');
  if (u && Date.now() - u > INACTIVO_MS){ S.porInactividad = true; lsSet('dr_act', null); auth.signOut(); }
}
function vigilarInactividad(){
  ['pointerdown','keydown','touchstart','wheel','scroll'].forEach(ev => addEventListener(ev, marcarActividad, {passive:true, capture:true}));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarInactividad(); });
  addEventListener('focus', revisarInactividad);
  setInterval(revisarInactividad, 30000);
}

async function arrancar(){
  if (DEMO){
    S.usuario = {email:ADMIN}; S.esAdmin = true; S.exento = true; S.perfil = {nombre:'Ricardo (demo)', equipo:true};
    return entrar();
  }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore();
  vigilarInactividad();
  auth.onAuthStateChanged(async user => {
    if (!user){
      S.usuario = null;
      const aviso = S.porInactividad ? 'Tu sesión se cerró después de 30 minutos sin uso. Vuelve a entrar.' : '';
      S.porInactividad = false;
      return pantallaLogin(aviso);
    }
    const email = (user.email || '').toLowerCase();
    // Si la app se quedó cerrada o sin usar más de 30 minutos, se pide entrar de nuevo
    const ult = lsGet('dr_act');
    if (!ult || Date.now() - ult > INACTIVO_MS){ S.porInactividad = !!ult; lsSet('dr_act', null); return auth.signOut(); }
    S.usuario = user; S.esAdmin = email === ADMIN; S.exento = EXENTOS.includes(email);
    pantalla('', '', `<div class="cargando">${GIRA(46)}<span>Verificando tu acceso…</span></div>`);
    try {
      const pCfg = db.collection('config').doc('app').get();
      const pUsr = email === ADMIN ? null : db.collection('usuarios').doc(email).get();
      if (email !== ADMIN && !lsGet('dr_j_' + hoyKey())) pedirJornada(hoyKey()).catch(() => {});
      const cfg = await pCfg;
      if (cfg.exists) S.config = Object.assign(S.config, cfg.data());
      if (S.esAdmin){
        S.perfil = {nombre:'Ricardo', equipo:true};
        db.collection('usuarios').onSnapshot(q => { S.usuarios = q.docs.map(d => ({id:d.id, ...d.data()})); if (S.vista === 'admin') render(); });
        return entrar();
      }
      const ref = db.collection('usuarios').doc(email), doc = await pUsr;
      if (!doc.exists && !S.exento) return pantallaRenovar('Sin acceso', `La cuenta ${esc(email)} no tiene suscripción a DICA REMATES. Escríbeme para activarla.`);
      S.perfil = doc.exists ? doc.data() : {nombre:email, equipo:true};
      if (S.exento && !doc.exists) S.perfil.equipo = true;
      if (S.perfil.suspendido) return pantallaRenovar('Cuenta suspendida', 'Tu acceso está suspendido. Escríbeme para reactivarlo.');
      if (vencido(S.perfil)) return pantallaRenovar('Tu acceso venció', `Tu suscripción terminó el ${esc(S.perfil.vence)}. Renueva para seguir viendo las proyecciones.`);
      if (!S.exento){
        const dev = deviceId(), lista = S.perfil.dispositivos || [];
        if (!lista.includes(dev)){
          if (lista.length >= MAX_DISP) return pantallaRenovar('Límite de dispositivos', `Esta cuenta ya está activa en ${MAX_DISP} dispositivos. Si cambiaste de celular, escríbeme para liberarla.`);
          await ref.update({dispositivos: firebase.firestore.FieldValue.arrayUnion(dev)});
        }
        proteger(email);
      }
      entrar();
    } catch(e){ pantalla('Error', 'No se pudo verificar tu acceso: ' + esc(e.message), '<button class="btn sec" onclick="location.reload()">Reintentar</button>'); }
  });
}
arrancar();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
